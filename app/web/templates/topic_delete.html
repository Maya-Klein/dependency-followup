{% extends "base.html" %}
{% block title %}מחיקת הנושא · מעקב תלויות{% endblock %}
{% block main_attrs %} class="narrow"{% endblock %}
{% block content %}
<a class="back" href="{{ url_for('main.detail', topic_id=topic.id) }}">&rarr; חזרה לנושא</a>
<h1>מחיקת הנושא</h1>

<form method="post" action="{{ url_for('main.delete', topic_id=topic.id) }}">
  <p class="confirm">למחוק את הנושא <strong class="confirm-title">{{ topic.title }}</strong>? אי אפשר לבטל את המחיקה.</p>
  <button type="submit" class="btn-danger">כן, למחוק את הנושא</button>
  <a class="cancel" href="{{ url_for('main.detail', topic_id=topic.id) }}">ביטול</a>
</form>
{% endblock %}
